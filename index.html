<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Stole the Golden Base</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #e6edf3;
  text-align: center;
}

h1 {
  margin-top: 20px;
  font-size: 22px;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 14px;
  color: #9da7b3;
  margin-bottom: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 140px);
  gap: 10px;
  justify-content: center;
  margin: 20px auto;
}

.piece {
  width: 140px;
  height: 140px;
  background: #1a222c;
  border: 2px dashed #2d3a4a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #6b7785;
}

.piece img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.progress {
  margin: 10px auto;
  width: 200px;
  height: 10px;
  background: #1a222c;
  border-radius: 5px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #00c2ff;
  transition: 0.5s;
}

.status {
  margin-top: 10px;
  font-size: 14px;
}

.flavor {
  margin-top: 10px;
  font-style: italic;
  color: #8aa0b6;
}

.complete {
  display: none;
  margin-top: 20px;
}

.complete img {
  width: 260px;
  border: 3px solid #00c2ff;
}

.cta {
  margin-top: 10px;
  font-weight: bold;
}

button {
  margin-top: 20px;
  background: transparent;
  border: 1px solid #555;
  color: #aaa;
  padding: 6px 10px;
  cursor: pointer;
}

button:hover {
  color: white;
  border-color: white;
}
</style>
</head>

<body>

<h1>🕵️ WHO STOLE THE GOLDEN BASE</h1>
<div class="subtitle">Recover all clues to identify the suspect</div>

<div class="grid">
  <div class="piece" id="slot1">CLASSIFIED</div>
  <div class="piece" id="slot2">CLASSIFIED</div>
  <div class="piece" id="slot3">CLASSIFIED</div>
  <div class="piece" id="slot4">CLASSIFIED</div>
</div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div class="status" id="status">0 of 4 clues recovered</div>
<div class="flavor" id="flavor"></div>

<div class="complete" id="complete">
  <h2>🚨 SUSPECT IDENTIFIED 🚨</h2>
  <img src="Full.jpg">
  <div class="cta">Show this screen to claim your reward</div>
</div>

<button onclick="resetGame()">Reset Investigation</button>

<script>
const params = new URLSearchParams(window.location.search);
const piece = params.get("p");

const flavorText = {
  1: "📹 Security footage recovered...",
  2: "👀 Witness report logged...",
  3: "🧾 Transaction record uncovered...",
  4: "🚨 FINAL CLUE ACQUIRED..."
};

let found = JSON.parse(localStorage.getItem("heistPieces")) || [];

// Add new piece
if (piece && !found.includes(piece)) {
  found.push(piece);
  localStorage.setItem("heistPieces", JSON.stringify(found));
  document.getElementById("flavor").innerText = flavorText[piece];
}

// Render pieces
found.forEach(p => {
  const slot = document.getElementById("slot" + p);
  slot.innerHTML = "<img src='piece" + p + ".jpg'>";
});

// Update progress
const progress = found.length;
document.getElementById("status").innerText = `${progress} of 4 clues recovered`;
document.getElementById("bar").style.width = (progress / 4 * 100) + "%";

// Completion
if (progress === 4) {
  document.getElementById("complete").style.display = "block";
  document.getElementById("flavor").innerText = "Case closed.";
}

// Reset
function resetGame() {
  localStorage.removeItem("heistPieces");
  location.href = location.pathname;
}
</script>

</body>
</html>
